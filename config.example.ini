[identity]
# Human-readable room/track name shown in Slack.
room = Track 1

[obs]
# OBS 28+ includes obs-websocket 5.x. Default port is 4455.
host = 127.0.0.1
port = 4455
scheme = ws
# Optional: set a complete URL instead of host/port/scheme.
# url = ws://127.0.0.1:4455

# Prefer setting this via OBS_MONITOR_OBS_PASSWORD.
password = CHANGE_ME
connect_timeout_seconds = 5
request_timeout_seconds = 5

[slack]
# Slack Incoming Webhook. Prefer OBS_MONITOR_SLACK_WEBHOOK_URL.
webhook_url = https://hooks.slack.com/services/CHANGE/ME
prefix = OBS Monitor
mention =
include_hostname = true
include_timestamp = true
timeout_seconds = 5

[monitoring]
# How often to ask OBS for GetRecordStatus.
poll_interval_seconds = 5

# Minimum wait before reconnecting after a failed WebSocket check.
reconnect_delay_seconds = 5

# If a Slack notification fails, do not retry it on every OBS poll.
notification_retry_seconds = 30

# Don't alert on one transient failure; alert after N consecutive failures.
failure_threshold = 3

# Successful checks required before sending a recovery message.
recovery_threshold = 1

# For the conference setup, OBS is expected to record continuously all day.
expect_recording = true

# Allow OBS some time to start recording after the agent starts.
startup_grace_seconds = 30

alert_on_startup = true
alert_on_connectivity = true
alert_on_record_start = true
alert_on_record_stop = true
alert_on_pause = true
alert_if_not_recording = true

# 0 disables repeated reminders.
repeat_offline_minutes = 5

# With heartbeats enabled, set this to 0 to avoid duplicate reminders.
repeat_not_recording_minutes = 0

# Periodic state confirmation:
# OK=recording, WARN=paused, CRITICAL=expected recording not active.
# 0 disables heartbeats.
heartbeat_minutes = 5

[logging]
level = INFO
# Relative paths are relative to this config file.
file = obs_slack_monitor.log
max_bytes = 1048576
backup_count = 3
